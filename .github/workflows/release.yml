name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build a release for, e.g. v1.1.0
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$TAG" || { echo "::error::tag $TAG != version $version"; exit 1; }
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Test the built wheel
        run: |
          sudo apt-get update && sudo apt-get install -y sdcc
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          /tmp/wheel-env/bin/switch2-hub-patcher --version
          /tmp/wheel-env/bin/python -c "from switch2_hub_patcher import fwupd; assert fwupd.QUIRK_SOURCE.is_file()"
          # Run the suite against the installed wheel, not the checkout: copy only the
          # test inputs (tests, contrib quirk, research draft, README) outside the tree.
          mkdir /tmp/wheel-root
          cp -r tests contrib research README.md /tmp/wheel-root/
          cd /tmp/wheel-root && /tmp/wheel-env/bin/python -m unittest discover -s tests
      - name: Checksums
        run: cd dist && sha256sum -- ./*.whl ./*.tar.gz > SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {grab=1; next}
            grab && /^## \[/ {exit}
            grab {print}
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md" > notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "switch2-hub-patcher $TAG" --notes-file notes.md
          fi
