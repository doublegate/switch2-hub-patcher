[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "switch2-hub-patcher"
version = "1.1.0"
description = "Nintendo Switch 2 dock firmware for a VL103/RTD2142 USB-C hub: offline hash-locked patcher plus verified dump/flash tools for Linux and macOS"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Michał Kopeć" }]
keywords = [
  "nintendo-switch-2", "dock", "firmware", "usb-c", "usb-pd", "vl103", "rtd2142",
  "8051", "fwupd", "flashrom", "hdr",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Assembly",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Hardware",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "pyright"]

[project.urls]
Homepage = "https://github.com/mkopec/switch2-hub-patcher"
Source = "https://github.com/mkopec/switch2-hub-patcher"
Issues = "https://github.com/mkopec/switch2-hub-patcher/issues"
Changelog = "https://github.com/mkopec/switch2-hub-patcher/blob/main/CHANGELOG.md"
Background = "https://blog.nozomi.space/posts/sw2_dock/"

[project.scripts]
switch2-hub-patcher = "switch2_hub_patcher.cli:main"

[tool.setuptools]
packages = ["switch2_hub_patcher"]

[tool.setuptools.package-data]
switch2_hub_patcher = ["asm/*.asm", "data/*.quirk"]

[tool.pyright]
include = ["switch2_hub_patcher", "tests"]
extraPaths = ["tests"]
pythonVersion = "3.9"
typeCheckingMode = "standard"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PLW", "RUF", "EXE"]
ignore = ["E501"]  # line length is enforced by `ruff format`; long string literals stay
